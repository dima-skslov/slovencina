<body>
<div id="app">
  <nav id="side" aria-label="Розділи"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<nav id="bottom" aria-label="Розділи"></nav>

<div id="player" hidden>
  <header class="pl-top">
    <button class="iconbtn" id="pl-close" aria-label="Закрити сесію"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="pl-bar" role="progressbar" aria-label="Прогрес сесії"><i id="pl-fill"></i></div>
    <span id="pl-count" class="small b muted"></span>
    <button class="btn ghost small" id="pl-cheatbtn" aria-expanded="false" hidden>Шпаргалка</button>
  </header>
  <div class="pl-mid">
    <div id="pl-body"></div>
    <div id="pl-scrim" hidden></div>
    <aside id="pl-cheat" aria-label="Шпаргалка" hidden></aside>
  </div>
  <footer id="pl-foot" class="pl-foot" hidden></footer>
</div>
